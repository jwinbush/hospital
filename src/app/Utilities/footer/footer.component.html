<footer class="site-footer">
    <div class="site-footer__main">

        <!-- Brand and contact -->
        <div class="site-footer__brand">
            <a routerLink="/" class="site-footer__logo">
                <img src="assets/images/serenity-health-logo.png" alt="Serenity Health">
            </a>
            <p class="site-footer__tagline">Compassionate, coordinated care for every stage of life.</p>
            <ul class="site-footer__contact">
                <li><i class="fas fa-phone" aria-hidden="true"></i> <a [href]="'tel:' + contact.phone">{{ contact.phone }}</a></li>
                <li><i class="fas fa-envelope" aria-hidden="true"></i> <a [href]="'mailto:' + contact.email">{{ contact.email }}</a></li>
            </ul>
            <a routerLink="/book-appointment" class="btn btn-light">Book an Appointment</a>
        </div>

        <!-- Sitemap columns -->
        <nav class="site-footer__nav" aria-label="Footer">
            <div *ngFor="let section of columns" class="site-footer__column">
                <h2 class="site-footer__heading">
                    <a [routerLink]="section.path">{{ section.label }}</a>
                </h2>
                <ul class="site-footer__links">
                    <li *ngFor="let link of section.children">
                        <a [routerLink]="link.path">{{ link.label }}</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- Bottom bar -->
    <div class="site-footer__bottom">
        <p>© {{ year }} Serenity Health. All rights reserved.</p>
        <ul class="site-footer__legal">
            <li><a routerLink="/find-a-doctor">Find a Doctor</a></li>
            <li><a routerLink="/patient-portal">Patient Portal</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Terms of Use</a></li>
        </ul>
    </div>
</footer>
