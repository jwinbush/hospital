<header class="site-header">

    <!-- Top bar: phone, locations, patient portal -->
    <div class="top-bar">
        <div class="top-bar__inner">
            <a [href]="'tel:' + contact.phone" class="top-bar__link">
                <i class="fas fa-phone" aria-hidden="true"></i> {{ contact.phone }}
            </a>
            <a routerLink="/contact/locations" class="top-bar__link">
                <i class="fas fa-map-marker-alt" aria-hidden="true"></i> Locations
            </a>
            <a routerLink="/patient-portal" class="top-bar__link">
                <i class="fas fa-user" aria-hidden="true"></i> Patient Portal
            </a>
        </div>
    </div>

    <!-- Main row: logo, navigation, book button -->
    <div class="header-main">
        <a routerLink="/" class="header-main__logo">
            <img src="assets/images/serenity-health-logo.png" alt="Serenity Health">
        </a>

        <nav class="main-nav" aria-label="Main">
            <ul class="main-nav__list">
                <li *ngFor="let item of navigation" class="main-nav__item">
                    <a [routerLink]="item.path" routerLinkActive="is-active" class="main-nav__link">
                        {{ item.label }}
                        <i *ngIf="item.children" class="fas fa-chevron-down main-nav__caret" aria-hidden="true"></i>
                    </a>

                    <ul *ngIf="item.children" class="main-nav__menu">
                        <li *ngFor="let child of item.children">
                            <a [routerLink]="child.path" class="main-nav__menu-link">{{ child.label }}</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>

        <div class="header-main__actions">
            <a routerLink="/book-appointment" class="btn btn-primary header-main__book">Book an Appointment</a>

            <button type="button" class="menu-toggle" (click)="toggleMenu()"
                    [attr.aria-expanded]="menuOpen" aria-controls="mobile-menu"
                    [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
                <i class="fas" [class.fa-bars]="!menuOpen" [class.fa-times]="menuOpen" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Mobile menu: full screen, sections expand in place -->
    <div id="mobile-menu" class="mobile-menu" [class.is-open]="menuOpen">
        <ul class="mobile-menu__list">
            <li *ngFor="let item of navigation" class="mobile-menu__item">
                <ng-container *ngIf="item.children; else plainLink">
                    <button type="button" class="mobile-menu__section"
                            (click)="toggleSection(item.label)"
                            [attr.aria-expanded]="openSection === item.label">
                        {{ item.label }}
                        <i class="fas" [class.fa-plus]="openSection !== item.label"
                           [class.fa-minus]="openSection === item.label" aria-hidden="true"></i>
                    </button>
                    <ul class="mobile-menu__sublist" *ngIf="openSection === item.label">
                        <li><a [routerLink]="item.path" class="mobile-menu__sublink">{{ item.label }} overview</a></li>
                        <li *ngFor="let child of item.children">
                            <a [routerLink]="child.path" class="mobile-menu__sublink">{{ child.label }}</a>
                        </li>
                    </ul>
                </ng-container>
                <ng-template #plainLink>
                    <a [routerLink]="item.path" class="mobile-menu__section">{{ item.label }}</a>
                </ng-template>
            </li>
            <li class="mobile-menu__item">
                <a routerLink="/patient-portal" class="mobile-menu__section">Patient Portal</a>
            </li>
        </ul>

        <div class="mobile-menu__actions">
            <a routerLink="/book-appointment" class="btn btn-primary btn-block">Book an Appointment</a>
            <a [href]="'tel:' + contact.phone" class="btn btn-tertiary btn-block">Call {{ contact.phone }}</a>
        </div>
    </div>
</header>
