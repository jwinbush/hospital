<app-page-hero
    eyebrow="Services"
    title="Care for you and your family"
    intro="Our services work together, so your primary care provider, specialists and counselors all share one plan for your health.">
</app-page-hero>

<section class="site-wrapper">
    <div class="site-container">
        <div class="grid grid-3">
            <a *ngFor="let service of services" [routerLink]="service.slug" class="card">
                <span class="card-icon"><i [class]="service.icon" aria-hidden="true"></i></span>
                <h2 class="card-title">{{ service.name }}</h2>
                <p class="card-text">{{ service.summary }}</p>
                <span class="card-link">Learn more</span>
            </a>
        </div>
    </div>
</section>

<app-cta-band></app-cta-band>
