<section class="page-hero">
    <div class="site-container">
        <nav aria-label="Breadcrumb">
            <ol class="breadcrumb">
                <li><a routerLink="/">Home</a></li>
                <li *ngFor="let crumb of breadcrumbs"><a [routerLink]="crumb.path">{{ crumb.label }}</a></li>
                <li aria-current="page">{{ title }}</li>
            </ol>
        </nav>

        <span class="eyebrow" *ngIf="eyebrow">{{ eyebrow }}</span>
        <h1 class="page-hero__title">{{ title }}</h1>
        <p class="page-hero__intro" *ngIf="intro">{{ intro }}</p>

        <!-- Optional buttons passed in from the page -->
        <div class="page-hero__actions"><ng-content></ng-content></div>
    </div>
</section>
